<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Profile</title>
</head>
<body>
  <div class="profile-header">
    <h1 class="profile-name">Jane Doe</h1>
  </div>
  <ul class="profile-stats">
    <li class="stat followers">
      <span class="stat-label">Followers</span>
      <span class="stat-value">1.2k</span>
    </li>
    <li class="stat friends">
      <span class="stat-label">Friends</span>
      <span class="stat-value">320</span>
    </li>
    <li class="stat fans">
      <span class="stat-label">Fans</span>
      <span class="stat-value">450</span>
    </li>
  </ul>
</body>
</html>
